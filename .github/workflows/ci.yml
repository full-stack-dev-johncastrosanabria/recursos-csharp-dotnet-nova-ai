name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  format:
    name: format and analysers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build with warnings as errors
        run: dotnet build --no-restore

  solvable:
    name: every exercise is solvable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Run every discovered test project against its reference solutions
        # This is the job that makes the repo trustworthy: it proves each
        # published exercise can actually be solved as written. The project
        # list comes from Training.Audit rather than a glob on a known tier
        # name, so a module that adds a new tier (say, tests/ContractTests)
        # can never be silently skipped here.
        run: |
          dotnet run --project tools/Training.Audit -- test-projects > /tmp/test-projects.txt
          while IFS= read -r project; do
            echo "::group::$project"
            dotnet test --project "$project" -p:UseSolutions=true
            echo "::endgroup::"
          done < /tmp/test-projects.txt

  stubs-are-empty:
    name: no answer left in a stub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Run every discovered test project against the stubs and collect reports
        run: |
          mkdir -p artifacts
          dotnet run --project tools/Training.Audit -- test-projects > /tmp/test-projects.txt
          while IFS= read -r project; do
            module="$(basename "$(dirname "$(dirname "$project")")")"
            tier="$(basename "$project")"
            # Failure is the expected outcome here.
            dotnet test --project "$project" \
              --report-trx --report-trx-filename "$module-$tier.trx" \
              --results-directory artifacts || true
          done < /tmp/test-projects.txt
      - name: Assert every exercise test failed, and every module on disk is represented
        run: dotnet run --project tools/Training.Audit -- stub-leak --trx artifacts

  audit:
    name: repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test the audit tool itself
        run: dotnet test --project tools/Training.Audit.Tests
      - name: Test the scaffolder
        run: dotnet test --project tools/Training.Scaffold.Tests
      - name: Pairs, API parity, guide anatomy and word count
        run: dotnet run --project tools/Training.Audit -- all
      - name: Verify the solution file has not drifted
        run: |
          tools/sync-solution.sh
          git diff --exit-code training.slnx

  integration:
    name: integration tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Run the Docker-backed tier against real PostgreSQL
        run: |
          dotnet run --project tools/Training.Audit -- test-projects > /tmp/test-projects.txt
          projects=()
          while IFS= read -r project; do
            case "$project" in
              */IntegrationTests) projects+=("$project") ;;
            esac
          done < /tmp/test-projects.txt
          if [ ${#projects[@]} -eq 0 ]; then
            echo "No integration projects yet."
            exit 0
          fi
          for project in "${projects[@]}"; do
            echo "::group::$project"
            dotnet test --project "$project" -p:UseSolutions=true
            echo "::endgroup::"
          done
