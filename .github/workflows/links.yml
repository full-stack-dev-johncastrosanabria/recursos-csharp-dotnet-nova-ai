name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch link rot in resources nobody is actively editing.
    - cron: "0 6 * * 1"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check links in guides and root docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --retry-wait-time 10
            --max-retries 3
            --accept 200,429
            --exclude-path .superpowers
            --exclude-path site
            --exclude-path artifacts
            --exclude-path .venv-docs
            './**/*.md'
          fail: true
