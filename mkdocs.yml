site_name: Recursos C# · .NET · Nova AI
site_description: A 30-module path from C# runtime semantics to senior distributed system judgement
repo_url: https://github.com/full-stack-dev-johncastrosanabria/recursos-csharp-dotnet-nova-ai
edit_uri: edit/main/
docs_dir: .

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - same-dir

exclude_docs: |
  artifacts/
  .superpowers/
  .venv-docs/
  docs/superpowers/
  tools/
  system/
  modules/*/src/
  modules/*/tests/
  modules/*/examples/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - Start here: START-HERE.md
  - Runtime and language semantics:
      - 01 · Type system and memory model: modules/01-type-system-and-memory/GUIDE.md
      - 02 · Object lifetime, GC and disposal: modules/02-object-lifetime-gc-and-disposal/GUIDE.md
      - 03 · Async, await and the thread pool: modules/03-async-await-and-the-thread-pool/GUIDE.md
      - 04 · LINQ and the modern language surface: modules/04-linq-and-the-modern-language-surface/GUIDE.md
  - Framework and platform:
      - 05 · Host configuration and options: modules/05-host-configuration-and-options/GUIDE.md
      - 06 · Dependency injection: modules/06-dependency-injection/GUIDE.md
      - 07 · The middleware pipeline: modules/07-the-middleware-pipeline/GUIDE.md
  - Contributing: CONTRIBUTING.md
